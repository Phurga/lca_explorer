[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lca-viewer"
version = "0.0.1"
description = "Process explorer and contribution analysis for life cycle assessment results"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas"]

[project.optional-dependencies]
brightway = ["bw2data>=4", "bw2calc>=2", "bw2io>=0.9"]
fast = ["pypardiso"]
dev = ["pytest"]

[project.scripts]
lca-viewer = "lca_viewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
